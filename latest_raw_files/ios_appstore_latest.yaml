  - name: iOS Microsoft Warehouse Management
    application_name: Microsoft Warehouse Management
    bundleId: com.microsoft.WarehouseManagement
    currentVersionReleaseDate: October 12, 2026
    icon_image: https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/bc/d3/39/bcd33904-52d2-33c9-b47b-17b5cf404211/AppIcon-0-1x_U007epad-0-1-85-220-0.png/512x512bb.jpg
    minimumOsVersion: '16.4'
    releaseNotes: 'Release notes: version 4.2.0.0

      Highlights

      Media capture

      Workers can take photos and videos and attach them to records. For example,
      a worker who finds damaged goods during receiving can photograph the damage
      and attach it to the license plate or item, so the damage is on record. The
      app automatically makes files smaller before upload, so uploads are fast and
      reliable.


      Note: This feature is included in this version of the app, and you can try it
      now in demo mode. To use it with your own data, you need server version 10.0.50.0
      or later.


      Easier connection setup

      A step-by-step setup that asks one question at a time replaces the long connection
      form. It includes help text and shows only the options that apply. The previous
      form is still available.


      Sign in with a QR code

      Frontline workers can sign in by scanning their badge and entering a PIN, instead
      of typing a username and password. On shared devices, each worker always signs
      in with their own account.


      More control for administrators

      With your device management tool, you can now:


      Give each device a name so it''s easier to identify (DeviceName).

      Prevent users from changing the app settings (LockClientSettings) or the connection
      settings (LockConnectionSettings).

      The app also checks for policy updates less often, which saves battery.


      Fixed issues

      Switching environments: Users can now switch between environments that use different
      accounts. Signing out of one connection no longer signs the user out of the
      others.

      Missing information on menu items: Fixed empty cards when all the fields on
      a card were hidden.

      Popup messages: When a worker chooses not to see a step instruction again, it
      now stays hidden.

      Worker sign-in: Tapping the sign-in button several times no longer causes a
      "session busy" error.

      Reconnect loop: When a session expires, Reconnect now asks the user to sign
      in again instead of retrying without end.

      Connection list: Long connection lists now have a search field.

      Scanner camera: The scanner camera image is no longer mirrored. Workers can
      also change this setting on each device.

      Panels during loading: Panels that slide over the screen now close when a new
      page starts loading.

      Physical numeric keypad: Quantities typed on a physical numeric keypad now appear
      correctly.

      Suggested quantity: Suggested quantities above 20 now appear when the quantity
      spinner is set to automatic.'
    version: 4.2.0
    app_store_url: https://apps.apple.com/us/app/microsoft-warehouse-management/id6444014310?uo=4
