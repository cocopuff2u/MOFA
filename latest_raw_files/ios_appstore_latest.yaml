  - name: iOS Microsoft Windows App Mobile
    application_name: Windows App Mobile
    bundleId: com.microsoft.rdc.ios
    currentVersionReleaseDate: September 17, 2026
    icon_image: https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/ee/3b/d1/ee3bd131-2867-20cb-4bb6-4ea44358bf8a/AppIcon-0-0-1x_U007epad-0-1-0-sRGB-85-220.png/512x512bb.jpg
    minimumOsVersion: '26.0'
    releaseNotes: "In this release we made the following updates:\n\n\u2022 Added\
      \ support for completing in-session WebAuthn challenges by using local passwordless\
      \ credentials.\n\u2022 Added external identity support.\n\u2022 Updated the\
      \ UX to replace \"Frontline\" with \"Flex Shared\" and \"Frontline Shared\"\
      \ with \"Flex Dedicated\".\n\u2022 Addressed Cloud PC tile status not updating\
      \ automatically (or promptly) after a state change.\n\u2022 Fixed an issue where\
      \ remote audio stopped rendering when connecting to Windows 7 PCs.\n\u2022 Resolved\
      \ a black screen encountered when connecting to an invalid resource while another\
      \ RemoteApp session was active.\n\u2022 Made updates to improve Continuous Access\
      \ Evaluation (CAE) scenarios for AVD and Windows 365.\n\u2022 Prevented hardware\
      \ keyboard focus from being captured when the app is inactive in Stage Manager\
      \ and Split View.\n\u2022 Fixed Add Workspace incorrectly preventing users from\
      \ adding the same AVD or Windows 365 feed with another account.\n\nIn addition,\
      \ we've also made numerous behind-the-scenes updates to improve performance\
      \ and stability, and to lay the groundwork for some upcoming features.\n\nIf\
      \ you encounter any errors, you can contact us via Settings > Submit Feedback."
    version: 11.3.7
    app_store_url: https://apps.apple.com/us/app/windows-app-mobile/id714464092?uo=4
