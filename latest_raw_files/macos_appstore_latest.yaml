  - name: MacOS Microsoft Windows App
    application_name: Windows App
    bundleId: com.microsoft.rdc.macos
    currentVersionReleaseDate: September 29, 2026
    icon_image: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/96/9f/4a/969f4a04-6289-d352-93f7-3f69f70f995f/AppIcon-0-0-85-220-0-0-6-0-2x.png/512x512bb.png
    minimumOsVersion: '14.0'
    releaseNotes: "In this release we made the following updates to address issues\
      \ with RemoteApp connections:\n\n\u2022 Resolved an issue where the secure desktop\
      \ window would appear empty while connecting to a remote app when using multiple\
      \ monitors.\n\u2022 Fixed mispaints that occurred if advanced RemoteFX graphics\
      \ were not being used to render remote apps.\n\nWe also fixed some other bugs:\n\
      \n\u2022 Fixed issues with ALT-based shortcuts (such as ALT+ENTER and ALT+UP\
      \ ARROW) in Unicode keyboard mode.\n\u2022 Resolved modifier-key state that\
      \ could interfere with subsequent SHIFT-based mouse click selections and keyboard\
      \ shortcuts.\n\u2022 Fixed a startup hang that prevented command-line operations\
      \ from completing.\n\u2022 Handled connection failures caused by saved credentials\
      \ containing a domain but no username (users will be prompted to correct invalid\
      \ credentials).\n\nIn addition, we made improvements to enhance diagnostics\
      \ insights:\n\n\u2022 Improved classification of sign-in errors to better distinguish\
      \ access restrictions from internal authentication failures.\n\u2022 Improved\
      \ connection and workspace diagnostics by identifying whether a signed-in Entra\
      \ account is a home or guest account.\n\u2022 Fixed an issue where UDP connection\
      \ drops caused by network instability were incorrectly classified.\n\nWe have\
      \ also added a toggle to enable WebAuthn redirection for AVD and Windows 365-based\
      \ connections (Settings > General > Use WebAuthn redirection). Individual PC\
      \ connections can be opted out of WebAuthn redirection by configuring published\
      \ PC custom settings (under the Devices & Audio tab).\n\nIf you encounter any\
      \ errors, you can contact us via Help > Submit Feedback."
    version: 11.4.3
    app_store_url: https://apps.apple.com/us/app/windows-app/id1295203466?mt=12&uo=4
